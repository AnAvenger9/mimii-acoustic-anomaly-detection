[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimii-research"
version = "0.1.0"
description = "Reproducible normal-only MIMII acoustic anomaly detection preprocessing"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "soundfile>=0.12,<1",
    "librosa>=0.10,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
trees = ["xgboost==3.1.2"]
metrics = ["scikit-learn>=1.4,<2"]
dev = ["pytest>=8,<10"]
train = ["torch>=2.2,<3", "scikit-learn>=1.4,<2"]
transfer = ["torch>=2.2,<3", "torchvision>=0.17,<1", "scikit-learn>=1.4,<2"]

[project.scripts]
mimii-preprocess = "mimii.preprocess:main"
mimii-train = "mimii.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
